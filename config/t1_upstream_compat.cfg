# FLSun T1 Pro: behavior that FLSun built into its Klipper fork, redone for upstream Klipper.
# Included by printer_upstream.cfg.

# --- Hotend relay -----------------------------------------------------------------------
# Relay PD6 powers the hotend heater. FLSun's extruder.py and heaters.py ran relay_on
# whenever the extruder got a target above 0, so slicer G-code, the screen and Mainsail
# never had to. These wrappers do the same for every way a target is set.

[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% if params.S is defined and params.S|float > 0.5 %}
        relay_on
    {% endif %}
    M104.1 {rawparams}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% if params.S is defined and params.S|float > 0.5 %}
        relay_on
    {% endif %}
    M109.1 {rawparams}

[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE_BASE
gcode:
    {% if params.HEATER|default('')|lower == 'extruder'
          and params.TARGET|default(0)|float > 0.5 %}
        relay_on
    {% endif %}
    _SET_HEATER_TEMPERATURE_BASE {rawparams}

[gcode_macro PID_CALIBRATE]
rename_existing: _PID_CALIBRATE_BASE
gcode:
    {% if params.HEATER|default('')|lower == 'extruder' %}
        relay_on
    {% endif %}
    _PID_CALIBRATE_BASE {rawparams}

# --- Slicer acceleration ----------------------------------------------------------------
# Orca/FLSun Slicer's Klipper G-code sends SET_VELOCITY_LIMIT ... ACCEL_TO_DECEL=..., which
# FLSun's Klipper used. Upstream replaced ACCEL_TO_DECEL with MINIMUM_CRUISE_RATIO and
# ignores it, so prints ran with the config's ratio and took 15-30% longer. This turns
# ACCEL_TO_DECEL into the same limit: MINIMUM_CRUISE_RATIO = 1 - ACCEL_TO_DECEL / ACCEL.

[gcode_macro SET_VELOCITY_LIMIT]
rename_existing: _SET_VELOCITY_LIMIT_BASE
gcode:
    {% if 'ACCEL_TO_DECEL' in params %}
        {% set accel = params.ACCEL|default(printer.toolhead.max_accel)|float %}
        {% set ratio = 1.0 - params.ACCEL_TO_DECEL|float / accel %}
        {% set ratio = [[ratio, 0.0]|max, 0.99]|min %}
        _SET_VELOCITY_LIMIT_BASE {% for k in params if k != 'ACCEL_TO_DECEL' %}{k}={params[k]} {% endfor %}MINIMUM_CRUISE_RATIO={ratio}
    {% else %}
        _SET_VELOCITY_LIMIT_BASE {rawparams}
    {% endif %}

# --- Filament runout --------------------------------------------------------------------
# FLSun's RunoutDebounceHelper paused only if the sensor still showed no filament after
# 1 second (5 checks, 0.2 s apart), so a short flicker didn't pause the print.

[gcode_macro _FLSUN_RUNOUT]
gcode:
    UPDATE_DELAYED_GCODE ID=_FLSUN_RUNOUT_CONFIRM DURATION=1

[delayed_gcode _FLSUN_RUNOUT_CONFIRM]
gcode:
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected
          and printer.print_stats.state == "printing" %}
        M117 Filament Runout Detected!
        PAUSE
    {% endif %}

# --- Bed mesh ---------------------------------------------------------------------------
# FLSun's Klipper (like Klipper before 2024) loaded the "default" mesh at startup.

[delayed_gcode _FLSUN_LOAD_DEFAULT_MESH]
initial_duration: 1
gcode:
    {% if 'default' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}
