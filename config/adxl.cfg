# FLSun T1 Pro: the ADXL345 for SHAPER_CALIBRATE, from FLSun's printer.cfg.
# Only works with current Klipper firmware on the mainboard: FLSun's firmware
# speaks an older ADXL345 protocol (Klipper stops with "MCU Protocol error"), so
# flsun_klipper_includes.cfg includes this file only once upstream Klipper has
# seen newer firmware on the mainboard (see extras/t1_mcu_version.py).

[adxl345]
cs_pin:PE11
spi_software_sclk_pin:PE14
spi_software_mosi_pin:PE13
spi_software_miso_pin:PE12
rate:1600

[resonance_tester]
probe_points:0, 0, 20
accel_chip: adxl345
min_freq: 30
max_freq: 50
accel_per_hz: 250

# As FLSun's: SAVE_CONFIG restarts Klipper, and LOAD_GCODE_OFFSETS (t1_pro.cfg)
# then sees resonances_state, clears it and homes.
[gcode_macro MEASURING_RESONANCES]
description: Measuring Resonances
gcode:
    M117 MEASURING RESONANCES START !
    G28
    SAVE_VARIABLE VARIABLE=resonances_state VALUE=True
    SHAPER_CALIBRATE
    G28
    SAVE_CONFIG
