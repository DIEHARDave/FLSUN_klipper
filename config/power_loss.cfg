# FLSUN_klipper: power loss recovery, like FLSun's own.
#
# extras/t1_power_loss.py saves a checkpoint at each layer change; the slicer
# must report layers (SET_PRINT_STATS_INFO CURRENT_LAYER=..., in Orca's layer
# change G-code). After the power comes back, Mainsail and Fluidd ask whether
# to continue: RESUME_INTERRUPTED or PLR_DISCARD. The interrupted layer is
# printed again from its start. Check that the print is still stuck to the bed
# first.

[t1_power_loss]

# The prompt below uses RESPOND.
[respond]

[delayed_gcode _FLSUN_PLR_PROMPT]
initial_duration: 3
gcode:
    {% set plr = printer.t1_power_loss %}
    {% if plr.interrupted and printer.print_stats.state in ('standby', 'error', 'complete', 'cancelled') %}
        {% set c = plr.checkpoint %}
        {% set name = c.file_path.split('/')[-1] %}
        RESPOND TYPE=echo MSG="Power loss: {name} was interrupted at layer {c.current_layer} of {c.total_layer}, Z {'%.2f' % c.z}. RESUME_INTERRUPTED continues it, PLR_DISCARD forgets it."
        RESPOND TYPE=command MSG="action:prompt_begin Continue the interrupted print?"
        RESPOND TYPE=command MSG="action:prompt_text {name} stopped at layer {c.current_layer} of {c.total_layer} (Z {'%.2f' % c.z}). Check that the part is still stuck to the bed and nothing is in the nozzle's way. The layer is printed again from its start."
        RESPOND TYPE=command MSG="action:prompt_footer_button Discard|PLR_DISCARD|error"
        RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME_INTERRUPTED|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro RESUME_INTERRUPTED]
description: Continue the print that a power loss interrupted
gcode:
    {% set plr = printer.t1_power_loss %}
    {% if not plr.interrupted %}
        {action_raise_error("There is no interrupted print to resume")}
    {% endif %}
    {% set c = plr.checkpoint %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set safe_z = [c.z + 5.0, max_z - 10.0]|min %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND MSG="Resuming {c.file_path.split('/')[-1]} at layer {c.current_layer}"
    CLEAR_PAUSE
    # Like FLSun's: warm the bed (to keep the part stuck) and soften anything
    # on the nozzle before homing. Homing a delta moves the nozzle up, away
    # from the part.
    # TEMPERATURE_WAIT MINIMUM rather than M109/M190: upstream's M190 waits
    # until the bed is within 1 C of its target from above too, and a bed
    # that's still warmer than the print's temperature cools very slowly.
    M140 S{c.bed_target}
    M104 S140
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=135
    G28
    {% if c.mesh %}
        BED_MESH_PROFILE LOAD="{c.mesh}"
    {% endif %}
    SET_GCODE_OFFSET Z={c.z_offset}
    {% if c.bed_target > 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={c.bed_target - 2}
    {% endif %}
    M104 S{c.extruder_target}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={c.extruder_target - 3}
    SET_PRESSURE_ADVANCE ADVANCE={c.pressure_advance}
    {% if c.extruder_current %}
        SET_TMC_CURRENT STEPPER=extruder CURRENT={c.extruder_current}
    {% endif %}
    # Above the part, then over the last position, then down to it.
    G90
    G1 Z{safe_z} F3000
    G1 X{c.x} Y{c.y} F6000
    G1 Z{c.z} F600
    M220 S{(c.speed_factor * 100)|round(0)}
    M221 S{(c.extrude_factor * 100)|round(0)}
    {% if c.absolute_extrude %}M82{% else %}M83{% endif %}
    G92 E{c.e}
    {% if not c.absolute_coordinates %}G91{% endif %}
    M106 S{(c.fan_speed / printer.configfile.settings.fan.max_power * 255)|round(0)}
    PLR_CONTINUE_FILE
